[package]
name = "finx"
version = "0.1.0"
edition = "2024"

[dependencies]
indexmap = { version = "2.7", features = ["serde"] }
petgraph = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_xlsxwriter = "0.99"
thiserror = "2.0"

[dev-dependencies]
zip = { version = "8.6", default-features = false }

[lints]
workspace = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

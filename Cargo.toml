[workspace]
resolver = "3"
members = [
    "crates/f8-core",
    "crates/f8-python",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
description = "Financial modeling engine with compiler verification and live Excel formulas"
authors = ["Michael (Chencheng) Hu, CFA"]
license = "AGPL-3.0-only"
repository = "https://github.com/mhcfa/f8"

[workspace.dependencies]
f8-core = { path = "crates/f8-core" }
indexmap = { version = "2.7", features = ["serde"] }
petgraph = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_xlsxwriter = "0.99"
thiserror = "2.0"
zip = { version = "8.6", default-features = false }
pyo3 = { version = "0.24", default-features = false, features = ["macros"] }
pythonize = "0.24"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

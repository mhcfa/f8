[workspace]
resolver = "3"
members = [
    "crates/f8-core",
    "crates/f8-cli",
    "crates/f8-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["f8 Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
f8-core = { path = "crates/f8-core" }
indexmap = { version = "2.7", features = ["serde"] }
petgraph = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_xlsxwriter = "0.99"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "8.6", default-features = false }
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.17"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "f8-engine"
dynamic = ["version"]
description = "Financial modeling engine with compiler verification and live Excel formulas"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Michael (Chencheng) Hu, CFA" }]
requires-python = ">=3.12"
keywords = ["excel", "financial-modeling", "spreadsheet", "xlsx", "compiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mhcfa/f8"
Documentation = "https://github.com/mhcfa/f8/tree/main/docs"
Repository = "https://github.com/mhcfa/f8"
Issues = "https://github.com/mhcfa/f8/issues"

[project.scripts]
f8 = "f8.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.8",
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.maturin]
manifest-path = "crates/f8-python/Cargo.toml"
python-source = "python"
module-name = "f8._core"
include = ["LICENSE"]
strip = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/f8-python/Cargo.toml" },
    { file = "crates/f8-python/src/**/*.rs" },
    { file = "crates/f8-core/src/**/*.rs" },
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["python"]
extraPaths = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]

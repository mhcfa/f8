name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches Cargo.toml and package.json versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify version synchronization
        run: |
          CARGO_VERSION=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          PKG_VERSION=$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("package.json").read_text())["version"])')
          if [ "$CARGO_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::Git tag version ($TAG_VERSION) does not match workspace version ($CARGO_VERSION)"
              exit 1
            fi
          fi
          echo "Verified workspace version $CARGO_VERSION"

  linux:
    name: Linux (${{ matrix.target }})
    needs: verify-tag
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: true
          manylinux: auto
      - name: Smoke test wheel (x86_64)
        if: matrix.target == 'x86_64'
        uses: astral-sh/setup-uv@v7
      - name: Run pytest against built wheel
        if: matrix.target == 'x86_64'
        run: |
          uv venv .venv
          uv pip install f8-engine --no-index --find-links dist
          uv pip install pytest
          uv run --no-sync pytest
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    name: macOS (${{ matrix.platform.target }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
      - uses: astral-sh/setup-uv@v7
      - name: Run pytest against built wheel
        run: |
          uv venv .venv
          uv pip install f8-engine --no-index --find-links dist
          uv pip install pytest
          uv run --no-sync pytest
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    name: Windows (${{ matrix.platform.target }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
      - uses: astral-sh/setup-uv@v7
      - name: Run pytest against built wheel
        shell: bash
        run: |
          uv venv .venv
          uv pip install f8-engine --no-index --find-links dist
          uv pip install pytest
          uv run --no-sync pytest
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Source distribution (sdist)
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  npm:
    name: npm package (WASM + TypeScript)
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build WASM and TypeScript package
        run: pnpm build
      - name: Run vitest against built package
        run: pnpm test
      - name: Upload built dist
        uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/f8-engine
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm:
    name: Publish to npm
    needs: [npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/f8-engine
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - name: Download built dist
        uses: actions/download-artifact@v8
        with:
          name: npm-dist
          path: dist
      - name: Publish to npm via Trusted Publishing
        run: npm publish --provenance --access public
